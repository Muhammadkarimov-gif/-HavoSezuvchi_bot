<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TozaHavo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ==================== BASE ==================== */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      color: #e2e8f0;
      overflow-x: hidden;
    }

    /* ==================== GLASSMORPHISM ==================== */
    .glass {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
    }

    .glass-dark {
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
    }

    /* ==================== HEADER ==================== */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15,12,41,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .header-region {
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      font-weight: 500;
    }

    /* ==================== SKELETON LOADING ==================== */
    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg,
        rgba(255,255,255,0.05) 25%,
        rgba(255,255,255,0.12) 50%,
        rgba(255,255,255,0.05) 75%
      );
      background-size: 800px 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 12px;
    }

    /* ==================== WEATHER ICONS ==================== */
    .weather-icon-wrap {
      width: 90px;
      height: 90px;
      position: relative;
      flex-shrink: 0;
    }

    /* SUN */
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes pulse-sun {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.75; transform: scale(0.93); }
    }
    .sun-rays { animation: spin-slow 8s linear infinite; transform-origin: 50% 50%; }
    .sun-core { animation: pulse-sun 3s ease-in-out infinite; transform-origin: 50% 50%; }

    /* CLOUD */
    @keyframes float-cloud {
      0%, 100% { transform: translateX(0); }
      50%       { transform: translateX(5px); }
    }
    .cloud-body { animation: float-cloud 4s ease-in-out infinite; }

    /* RAIN */
    @keyframes fall-drop {
      0%   { transform: translateY(-8px); opacity: 0; }
      30%  { opacity: 1; }
      100% { transform: translateY(20px); opacity: 0; }
    }
    .rain-drop-1 { animation: fall-drop 1.1s ease-in infinite 0s; }
    .rain-drop-2 { animation: fall-drop 1.1s ease-in infinite 0.3s; }
    .rain-drop-3 { animation: fall-drop 1.1s ease-in infinite 0.6s; }
    .rain-drop-4 { animation: fall-drop 1.1s ease-in infinite 0.15s; }

    /* SNOW */
    @keyframes fall-snow {
      0%   { transform: translateY(-8px) rotate(0deg); opacity: 0; }
      30%  { opacity: 1; }
      100% { transform: translateY(20px) rotate(180deg); opacity: 0; }
    }
    .snow-flake-1 { animation: fall-snow 1.6s ease-in infinite 0s; }
    .snow-flake-2 { animation: fall-snow 1.6s ease-in infinite 0.5s; }
    .snow-flake-3 { animation: fall-snow 1.6s ease-in infinite 1.0s; }

    /* WIND */
    @keyframes blow {
      0%   { stroke-dashoffset: 100; opacity: 0; }
      40%  { opacity: 1; }
      100% { stroke-dashoffset: 0;   opacity: 0; }
    }
    .wind-line-1 { animation: blow 1.6s ease-in-out infinite 0s; stroke-dasharray: 100; }
    .wind-line-2 { animation: blow 1.6s ease-in-out infinite 0.4s; stroke-dasharray: 100; }
    .wind-line-3 { animation: blow 1.6s ease-in-out infinite 0.8s; stroke-dasharray: 100; }

    /* ==================== GAUGE ==================== */
    .gauge-wrap {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto;
    }
    .gauge-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .gauge-pct {
      font-size: 40px;
      font-weight: 800;
      line-height: 1;
    }
    .gauge-label {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ==================== REGION PILLS ==================== */
    .regions-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 8px;
      scrollbar-width: none;
    }
    .regions-scroll::-webkit-scrollbar { display: none; }

    .region-pill {
      flex-shrink: 0;
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1.5px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.75);
      white-space: nowrap;
    }
    .region-pill:hover {
      background: rgba(167,139,250,0.15);
      border-color: rgba(167,139,250,0.4);
      color: #a78bfa;
    }
    .region-pill.active {
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      border-color: transparent;
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(167,139,250,0.35);
    }

    /* ==================== AI ASSISTANT ==================== */
    .ai-input {
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #e2e8f0;
      font-size: 15px;
      padding: 12px 16px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
    }
    .ai-input::placeholder { color: rgba(255,255,255,0.3); }
    .ai-input:focus { border-color: rgba(167,139,250,0.5); }

    .ai-btn {
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 24px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    .ai-btn:hover { opacity: 0.9; }
    .ai-btn:active { transform: scale(0.97); }
    .ai-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .ai-answer-point {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      border-left: 3px solid #a78bfa;
      font-size: 14px;
      line-height: 1.5;
    }
    .ai-point-num {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }

    /* ==================== STAT CHIPS ==================== */
    .stat-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      flex: 1;
      min-width: 0;
    }
    .stat-chip-val {
      font-size: 18px;
      font-weight: 700;
    }
    .stat-chip-label {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      text-align: center;
    }

    /* ==================== SPINNER ==================== */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }

    /* ==================== SCROLLBAR ==================== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.3); border-radius: 4px; }
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
  <div>
    <div class="header-title">🌬️ TozaHavo</div>
    <div class="header-region" id="header-region">Yuklanmoqda...</div>
  </div>
  <div id="header-loader" class="spinner" style="display:none;"></div>
</header>

<!-- ===== MAIN CONTENT ===== -->
<main style="padding: 16px; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;">

  <!-- REGION SELECTOR (top, so user can pick immediately) -->
  <section>
    <div style="font-size:12px; color:rgba(255,255,255,0.4); font-weight:600; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:8px;">
      Hududni tanlang
    </div>
    <div class="regions-scroll" id="regions-scroll"></div>
  </section>

  <!-- WEATHER CARD -->
  <section class="glass" style="padding:20px;" id="weather-card">
    <!-- Skeleton -->
    <div id="weather-skeleton">
      <div class="skeleton" style="height:24px; width:60%; margin-bottom:16px;"></div>
      <div style="display:flex; gap:16px; align-items:center;">
        <div class="skeleton" style="width:90px; height:90px; border-radius:16px;"></div>
        <div style="flex:1;">
          <div class="skeleton" style="height:48px; width:80%; margin-bottom:8px;"></div>
          <div class="skeleton" style="height:16px; width:60%;"></div>
        </div>
      </div>
      <div style="display:flex; gap:8px; margin-top:16px;">
        <div class="skeleton" style="flex:1; height:60px; border-radius:14px;"></div>
        <div class="skeleton" style="flex:1; height:60px; border-radius:14px;"></div>
        <div class="skeleton" style="flex:1; height:60px; border-radius:14px;"></div>
      </div>
    </div>
    <!-- Real content (hidden until loaded) -->
    <div id="weather-content" style="display:none;">
      <div style="font-size:13px; font-weight:600; color:rgba(255,255,255,0.45); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:12px;">
        Hozirgi ob-havo
      </div>
      <div style="display:flex; gap:16px; align-items:center; margin-bottom:16px;">
        <div class="weather-icon-wrap" id="weather-icon-container"></div>
        <div>
          <div style="font-size:52px; font-weight:800; line-height:1;" id="weather-temp">--°</div>
          <div style="font-size:14px; color:rgba(255,255,255,0.55); margin-top:4px;" id="weather-desc">--</div>
        </div>
      </div>
      <div style="display:flex; gap:8px;">
        <div class="stat-chip">
          <div class="stat-chip-val" id="stat-feels">--°</div>
          <div class="stat-chip-label">His qilish</div>
        </div>
        <div class="stat-chip">
          <div class="stat-chip-val" id="stat-humidity">--%</div>
          <div class="stat-chip-label">Namlik</div>
        </div>
        <div class="stat-chip">
          <div class="stat-chip-val" id="stat-wind">-- m/s</div>
          <div class="stat-chip-label">Shamol</div>
        </div>
      </div>
    </div>
    <!-- Error state -->
    <div id="weather-error" style="display:none; text-align:center; padding:20px;">
      <div style="font-size:32px; margin-bottom:8px;">⚠️</div>
      <div style="color:rgba(255,255,255,0.5); font-size:14px;">Ma'lumotlarni yuklashda xato</div>
    </div>
  </section>

  <!-- AIR QUALITY CARD -->
  <section class="glass" style="padding:20px;" id="air-card">
    <!-- Skeleton -->
    <div id="air-skeleton">
      <div class="skeleton" style="height:24px; width:60%; margin-bottom:16px;"></div>
      <div class="skeleton" style="width:180px; height:180px; border-radius:50%; margin:0 auto 16px;"></div>
      <div class="skeleton" style="height:20px; width:70%; margin:0 auto 8px;"></div>
      <div style="display:flex; gap:8px;">
        <div class="skeleton" style="flex:1; height:50px; border-radius:12px;"></div>
        <div class="skeleton" style="flex:1; height:50px; border-radius:12px;"></div>
      </div>
    </div>
    <!-- Real content -->
    <div id="air-content" style="display:none;">
      <div style="font-size:13px; font-weight:600; color:rgba(255,255,255,0.45); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:16px;">
        Havo Sifati
      </div>

      <!-- Gauge -->
      <div class="gauge-wrap">
        <svg viewBox="0 0 200 200" width="180" height="180" style="transform:rotate(-90deg);">
          <!-- Track -->
          <circle cx="100" cy="100" r="80"
            fill="none"
            stroke="rgba(255,255,255,0.08)"
            stroke-width="14"
            stroke-linecap="round" />
          <!-- Progress -->
          <circle cx="100" cy="100" r="80"
            fill="none"
            id="gauge-circle"
            stroke="#22c55e"
            stroke-width="14"
            stroke-linecap="round"
            stroke-dasharray="502"
            stroke-dashoffset="502"
            style="transition: stroke-dashoffset 1s ease, stroke 0.5s ease;" />
        </svg>
        <div class="gauge-text">
          <div class="gauge-pct" id="gauge-pct" style="color:#22c55e;">--%</div>
          <div class="gauge-label">toza havo</div>
        </div>
      </div>

      <!-- Status text -->
      <div style="text-align:center; margin: 14px 0 16px; font-size:16px; font-weight:600;" id="aqi-status-text">
        --
      </div>

      <!-- PM2.5 & AQI chips -->
      <div style="display:flex; gap:8px;">
        <div class="stat-chip">
          <div class="stat-chip-val" id="air-pm25">--</div>
          <div class="stat-chip-label">PM2.5 µg/m³</div>
        </div>
        <div class="stat-chip">
          <div class="stat-chip-val" id="air-aqi">--</div>
          <div class="stat-chip-label">AQI indeksi</div>
        </div>
      </div>
    </div>
    <!-- Error state -->
    <div id="air-error" style="display:none; text-align:center; padding:20px;">
      <div style="font-size:32px; margin-bottom:8px;">⚠️</div>
      <div style="color:rgba(255,255,255,0.5); font-size:14px;">Havo sifati ma'lumotlari yuklanmadi</div>
    </div>
  </section>

  <!-- AI ASSISTANT CARD -->
  <section class="glass" style="padding:20px; margin-bottom:24px;">
    <div style="font-size:13px; font-weight:600; color:rgba(255,255,255,0.45); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:14px;">
      🤖 AI Yordamchi
    </div>
    <div style="display:flex; gap:10px; margin-bottom:12px;">
      <textarea
        class="ai-input"
        id="ai-input"
        rows="2"
        placeholder="Havo haqida savol bering... (masalan: bugun picnikga chiqish mumkinmi?)"
      ></textarea>
    </div>
    <button class="ai-btn" id="ai-btn" style="width:100%;" onclick="askAI()">
      So'rash
    </button>

    <!-- AI Response -->
    <div id="ai-response" style="display:none; margin-top:16px; display:flex; flex-direction:column; gap:8px;">
    </div>
    <div id="ai-loading" style="display:none; text-align:center; padding:16px;">
      <div class="spinner" style="margin:0 auto 8px;"></div>
      <div style="font-size:13px; color:rgba(255,255,255,0.4);">AI javob tayyorlamoqda...</div>
    </div>
  </section>

</main>

<script>
// =====================================================
// TELEGRAM MINI APP INIT
// =====================================================
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.BackButton.onClick(() => tg.close());
}

// =====================================================
// REGIONS DATA
// =====================================================
const REGIONS = {
  tashkent:      "Toshkent",
  navoi:         "Navoiy",
  samarkand:     "Samarqand",
  bukhara:       "Buxoro",
  fergana:       "Farg'ona",
  andijan:       "Andijon",
  namangan:      "Namangan",
  kashkadarya:   "Qashqadaryo",
  surkhandarya:  "Surxondaryo",
  jizzakh:       "Jizzax",
  syrdarya:      "Sirdaryo",
  khorezm:       "Xorazm",
  karakalpakstan:"Qoraqalpog'iston"
};

let currentRegion = localStorage.getItem("tozahavo_region") || "tashkent";

// =====================================================
// WEATHER ICON SVGs (animated, inline)
// =====================================================
const ICONS = {
  sunny: `
    <svg viewBox="0 0 90 90" width="90" height="90" xmlns="http://www.w3.org/2000/svg">
      <!-- Rays ring -->
      <g class="sun-rays" style="transform-origin:45px 45px">
        ${Array.from({length:8},(_,i)=>{
          const a = i * 45;
          const r1=28, r2=38;
          const rad = a*Math.PI/180;
          const x1=45+r1*Math.sin(rad), y1=45-r1*Math.cos(rad);
          const x2=45+r2*Math.sin(rad), y2=45-r2*Math.cos(rad);
          return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>`;
        }).join('')}
      </g>
      <!-- Core -->
      <circle cx="45" cy="45" r="20" fill="#fbbf24" class="sun-core"/>
      <circle cx="45" cy="45" r="15" fill="#fde68a" class="sun-core"/>
    </svg>`,

  cloudy: `
    <svg viewBox="0 0 90 90" width="90" height="90" xmlns="http://www.w3.org/2000/svg">
      <g class="cloud-body">
        <!-- Back cloud -->
        <ellipse cx="58" cy="52" rx="22" ry="14" fill="rgba(148,163,184,0.5)"/>
        <!-- Main cloud -->
        <ellipse cx="40" cy="56" rx="26" ry="16" fill="#94a3b8"/>
        <circle cx="30" cy="50" r="12" fill="#94a3b8"/>
        <circle cx="48" cy="46" r="15" fill="#cbd5e1"/>
        <circle cx="62" cy="52" r="10" fill="#94a3b8"/>
      </g>
    </svg>`,

  rainy: `
    <svg viewBox="0 0 90 90" width="90" height="90" xmlns="http://www.w3.org/2000/svg">
      <!-- Cloud -->
      <g class="cloud-body">
        <ellipse cx="40" cy="40" rx="26" ry="16" fill="#64748b"/>
        <circle cx="30" cy="34" r="12" fill="#64748b"/>
        <circle cx="48" cy="30" r="15" fill="#94a3b8"/>
        <circle cx="60" cy="36" r="10" fill="#64748b"/>
      </g>
      <!-- Drops -->
      <line class="rain-drop-1" x1="28" y1="58" x2="24" y2="72" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
      <line class="rain-drop-2" x1="42" y1="58" x2="38" y2="72" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
      <line class="rain-drop-3" x1="56" y1="58" x2="52" y2="72" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
      <line class="rain-drop-4" x1="35" y1="62" x2="31" y2="76" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    </svg>`,

  snowy: `
    <svg viewBox="0 0 90 90" width="90" height="90" xmlns="http://www.w3.org/2000/svg">
      <!-- Cloud -->
      <g class="cloud-body">
        <ellipse cx="40" cy="38" rx="26" ry="16" fill="#64748b"/>
        <circle cx="30" cy="32" r="12" fill="#64748b"/>
        <circle cx="48" cy="28" r="15" fill="#94a3b8"/>
        <circle cx="60" cy="34" r="10" fill="#64748b"/>
      </g>
      <!-- Snowflakes -->
      <text class="snow-flake-1" x="24" y="62" font-size="14" fill="#e0f2fe" text-anchor="middle">❄</text>
      <text class="snow-flake-2" x="45" y="60" font-size="12" fill="#bae6fd" text-anchor="middle">❄</text>
      <text class="snow-flake-3" x="62" y="63" font-size="13" fill="#e0f2fe" text-anchor="middle">❄</text>
    </svg>`,

  windy: `
    <svg viewBox="0 0 90 90" width="90" height="90" xmlns="http://www.w3.org/2000/svg">
      <line class="wind-line-1" x1="10" y1="30" x2="75" y2="30" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
      <line class="wind-line-2" x1="15" y1="45" x2="70" y2="45" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
      <line class="wind-line-3" x1="20" y1="60" x2="65" y2="60" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
      <!-- Arrow heads -->
      <polyline points="65,24 75,30 65,36" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="60,39 70,45 60,51" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="55,54 65,60 55,66" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`
};

// WMO code → icon type
function getIconType(wmoCode) {
  if ([0,1].includes(wmoCode)) return 'sunny';
  if ([2,3].includes(wmoCode)) return 'cloudy';
  if ([51,53,55,61,63,65,80,81,82].includes(wmoCode)) return 'rainy';
  if ([71,73,75,77].includes(wmoCode)) return 'snowy';
  if ([55,57,61,63,65,66,67].includes(wmoCode)) return 'rainy';
  return 'cloudy';
}

// WMO descriptions in Uzbek
function getWeatherDesc(code) {
  const map = {
    0:  "Aniq, ochiq ko'k",
    1:  "Asosan tiniq",
    2:  "Qisman bulutli",
    3:  "Bulutli (to'liq)",
    45: "Tuman",
    48: "Qirovli tuman",
    51: "Yengil shivirlab yomg'ir",
    53: "Mo'tadil shivirlab yomg'ir",
    55: "Kuchli shivirlab yomg'ir",
    61: "Yengil yomg'ir",
    63: "Mo'tadil yomg'ir",
    65: "Kuchli yomg'ir",
    71: "Yengil qor",
    73: "Mo'tadil qor",
    75: "Kuchli qor",
    77: "Qor donalari",
    80: "Yengil jala",
    81: "Mo'tadil jala",
    82: "Kuchli jala",
    95: "Momaqaldiroq",
    96: "Jala va do'l",
    99: "Kuchli do'l"
  };
  return map[code] || "Ob-havo";
}

// =====================================================
// AQI STATUS TEXTS (Uzbek)
// =====================================================
function getAqiStatus(aqi) {
  if (aqi <= 50)  return "Zo'r! Havo juda toza 🌿";
  if (aqi <= 100) return "Yaxshi. Havo toza 😊";
  if (aqi <= 150) return "O'rtacha. Ehtiyot bo'ling 😐";
  if (aqi <= 200) return "Yomon. Niqob tavsiya etiladi 😷";
  if (aqi <= 300) return "Juda yomon! Tashqariga chiqmang ⚠️";
  return "Xavfli! Favqulodda holat 🚨";
}

function getGaugeColor(pct) {
  if (pct >= 80) return "#22c55e";
  if (pct >= 50) return "#eab308";
  return "#ef4444";
}

// =====================================================
// RENDER REGION PILLS
// =====================================================
function renderRegions() {
  const container = document.getElementById("regions-scroll");
  container.innerHTML = "";
  for (const [key, label] of Object.entries(REGIONS)) {
    const pill = document.createElement("button");
    pill.className = "region-pill" + (key === currentRegion ? " active" : "");
    pill.textContent = label;
    pill.dataset.key = key;
    pill.addEventListener("click", () => selectRegion(key));
    container.appendChild(pill);
  }
  // Scroll active into view
  setTimeout(() => {
    const active = container.querySelector(".active");
    if (active) active.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
  }, 100);
}

function selectRegion(key) {
  if (key === currentRegion) return;
  currentRegion = key;
  localStorage.setItem("tozahavo_region", key);
  renderRegions();
  loadAll();
}

// =====================================================
// SKELETON HELPERS
// =====================================================
function showWeatherSkeleton() {
  document.getElementById("weather-skeleton").style.display = "block";
  document.getElementById("weather-content").style.display = "none";
  document.getElementById("weather-error").style.display = "none";
}
function showAirSkeleton() {
  document.getElementById("air-skeleton").style.display = "block";
  document.getElementById("air-content").style.display = "none";
  document.getElementById("air-error").style.display = "none";
}

// =====================================================
// UPDATE GAUGE
// =====================================================
function updateGauge(pct) {
  const circumference = 2 * Math.PI * 80; // ≈ 502.65
  const offset = circumference - (pct / 100) * circumference;
  const color = getGaugeColor(pct);
  const circle = document.getElementById("gauge-circle");
  const pctEl  = document.getElementById("gauge-pct");
  circle.style.strokeDashoffset = offset;
  circle.style.stroke = color;
  pctEl.textContent = pct + "%";
  pctEl.style.color = color;
}

// =====================================================
// FETCH WEATHER
// =====================================================
async function fetchWeather(region) {
  showWeatherSkeleton();
  try {
    const res = await fetch(`/api/weather?region=${region}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    renderWeather(data);
  } catch(e) {
    document.getElementById("weather-skeleton").style.display = "none";
    document.getElementById("weather-error").style.display = "block";
    console.error("Weather fetch error:", e);
  }
}

function renderWeather(data) {
  document.getElementById("weather-skeleton").style.display = "none";
  document.getElementById("weather-error").style.display = "none";

  const content = document.getElementById("weather-content");
  content.style.display = "block";

  const temp     = Math.round(data.temperature ?? data.temp ?? 0);
  const feels    = Math.round(data.feels_like ?? data.feelsLike ?? temp);
  const humidity = Math.round(data.humidity ?? 0);
  const wind     = (data.wind_speed ?? data.windSpeed ?? 0).toFixed(1);
  const wmo      = data.weather_code ?? data.weatherCode ?? 0;

  document.getElementById("weather-temp").textContent     = temp + "°C";
  document.getElementById("weather-desc").textContent     = getWeatherDesc(wmo);
  document.getElementById("stat-feels").textContent       = feels + "°C";
  document.getElementById("stat-humidity").textContent    = humidity + "%";
  document.getElementById("stat-wind").textContent        = wind + " m/s";

  const iconKey = getIconType(wmo);
  document.getElementById("weather-icon-container").innerHTML = ICONS[iconKey] || ICONS.cloudy;
}

// =====================================================
// FETCH AIR QUALITY
// =====================================================
async function fetchAirQuality(region) {
  showAirSkeleton();
  try {
    const res = await fetch(`/api/air-quality?region=${region}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    renderAirQuality(data);
  } catch(e) {
    document.getElementById("air-skeleton").style.display = "none";
    document.getElementById("air-error").style.display = "block";
    console.error("Air quality fetch error:", e);
  }
}

function renderAirQuality(data) {
  document.getElementById("air-skeleton").style.display = "none";
  document.getElementById("air-error").style.display = "none";

  const content = document.getElementById("air-content");
  content.style.display = "block";

  const aqi     = data.aqi ?? 0;
  const pm25    = (data.pm25 ?? data.pm2_5 ?? 0).toFixed(1);
  const cleanPct= data.clean_air_pct ?? Math.max(0, Math.min(100, Math.round(100 - (aqi/500)*100)));

  document.getElementById("air-pm25").textContent       = pm25;
  document.getElementById("air-aqi").textContent        = aqi;
  document.getElementById("aqi-status-text").textContent= getAqiStatus(aqi);

  updateGauge(cleanPct);
}

// =====================================================
// LOAD ALL DATA
// =====================================================
function loadAll() {
  document.getElementById("header-region").textContent = REGIONS[currentRegion] || currentRegion;
  document.getElementById("header-loader").style.display = "inline-block";
  Promise.all([
    fetchWeather(currentRegion),
    fetchAirQuality(currentRegion)
  ]).finally(() => {
    document.getElementById("header-loader").style.display = "none";
  });
}

// =====================================================
// AI ASSISTANT
// =====================================================
async function askAI() {
  const input  = document.getElementById("ai-input");
  const btn    = document.getElementById("ai-btn");
  const loader = document.getElementById("ai-loading");
  const resp   = document.getElementById("ai-response");
  const q      = input.value.trim();
  if (!q) return;

  btn.disabled = true;
  resp.style.display = "none";
  loader.style.display = "block";

  try {
    const res = await fetch("/api/ai-assistant", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, region: currentRegion })
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    // Expect data.answer as string or array of 4 points
    let points = [];
    if (Array.isArray(data.answer)) {
      points = data.answer;
    } else if (typeof data.answer === "string") {
      // Try to split by newlines / numbered list
      points = data.answer
        .split(/\n+/)
        .map(s => s.replace(/^\d+[\.\)]\s*/, "").trim())
        .filter(s => s.length > 0)
        .slice(0, 4);
      while (points.length < 4) points.push("—");
    }

    resp.innerHTML = "";
    points.forEach((pt, i) => {
      const div = document.createElement("div");
      div.className = "ai-answer-point";
      div.innerHTML = `<div class="ai-point-num">${i+1}</div><div>${pt}</div>`;
      resp.appendChild(div);
    });
    resp.style.display = "flex";
  } catch(e) {
    resp.innerHTML = `<div class="ai-answer-point" style="border-left-color:#ef4444;">
      <div class="ai-point-num" style="background:#ef4444;">!</div>
      <div>AI javob berishda xato yuz berdi. Iltimos qayta urinib ko'ring.</div>
    </div>`;
    resp.style.display = "flex";
    console.error("AI error:", e);
  } finally {
    loader.style.display = "none";
    btn.disabled = false;
  }
}

// Allow Enter (Shift+Enter for newline) in textarea to submit
document.getElementById("ai-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    askAI();
  }
});

// =====================================================
// INIT
// =====================================================
renderRegions();
loadAll();
</script>
